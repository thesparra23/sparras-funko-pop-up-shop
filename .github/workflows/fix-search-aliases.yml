name: Fix Search Aliases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve search matching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/page.tsx")
          text = path.read_text()

          old = '''        return tokens.every((token) =>\n          searchableText.includes(token)\n        );'''

          new = '''        const searchAliases: Record<string, string[]> = {\n          masters: [\n            "masters",\n            "master",\n            "masters of the universe",\n            "master of the universe",\n            "motu",\n            "he-man",\n            "he man",\n            "heman",\n            "skeletor",\n            "eternia",\n            "grayskull",\n          ],\n          master: [\n            "masters",\n            "master",\n            "masters of the universe",\n            "master of the universe",\n            "motu",\n            "he-man",\n            "he man",\n            "heman",\n            "skeletor",\n            "eternia",\n            "grayskull",\n          ],\n          motu: [\n            "masters",\n            "masters of the universe",\n            "motu",\n            "he-man",\n            "he man",\n            "heman",\n            "skeletor",\n            "eternia",\n            "grayskull",\n          ],\n          heman: [\n            "he-man",\n            "he man",\n            "heman",\n            "masters",\n            "masters of the universe",\n            "motu",\n          ],\n          "he-man": [\n            "he-man",\n            "he man",\n            "heman",\n            "masters",\n            "masters of the universe",\n            "motu",\n          ],\n        };\n\n        return tokens.every((token) => {\n          if (searchableText.includes(token)) {\n            return true;\n          }\n\n          const aliases = searchAliases[token];\n\n          if (!aliases) {\n            return false;\n          }\n\n          return aliases.some((alias) =>\n            searchableText.includes(alias)\n          );\n        });'''

          if old not in text:
              raise SystemExit("Search block not found; no changes made.")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit search fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Fix Masters of the Universe search"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-search-aliases.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary search fix workflow" || true
          git push || true
